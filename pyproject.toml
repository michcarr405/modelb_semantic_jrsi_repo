[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modelb-semantic-jsri-repo"
version = "2.0.0"
description = "Reproducibility implementation and frozen Round-2 MP-primary evidence for JRSI manuscript rsif-2026-0516."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "matplotlib", "pandas", "numba", "tqdm"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
