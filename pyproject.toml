[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modelb-semantic-jsri-repo"
version = "0.2.0"
description = "Original Model B reruns plus JSRI-oriented intervention-based semantic analysis with no-kmeans primary frontiers and alternative viability definitions."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "matplotlib", "pandas", "numba", "tqdm"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
