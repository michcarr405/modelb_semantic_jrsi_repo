name: Round-2 release validation
on:
  workflow_dispatch:
  push:
    tags:
      - 'jrsi-reproducibility-v2*'
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Install
        run: python -m pip install -r round2_mp/validation/requirements-validated.txt -e .
      - name: Foundation tests
        run: python -m pytest -q tests
      - name: Integrated numerical evidence
        run: python round2_mp/validation/validate_integrated.py
      - name: Code and data packaging
        run: python round2_mp/validation/validate_packaged.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round2-release-validation
          path: |
            round2_mp/validation/INTEGRATED_REGENERATION_VALIDATION.json
            round2_mp/validation/RC7_PACKAGED_VALIDATION.json

  figures:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install plotting dependencies
        run: python -m pip install -r round2_mp/figure_build/requirements-figures.txt
      - name: Build final figure layouts
        run: python round2_mp/figure_build/build_figures.py --output ${{ runner.temp }}/round2-figure-replay
      - name: Compare final figure pixels
        run: python round2_mp/figure_build/verify_figures.py --generated ${{ runner.temp }}/round2-figure-replay
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round2-figure-build-validation
          path: ${{ runner.temp }}/round2-figure-replay/FIGURE_BUILD_VALIDATION.json
