name: Reproducibility validation

on:
  workflow_dispatch:
  push:
    tags:
      - 'jrsi-reproducibility-v*'

jobs:
  clean-room-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out release
        uses: actions/checkout@v4

      - name: Install publication fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-croscore
          fc-cache -f
          {
            echo "Runner: ubuntu-24.04"
            echo "Arimo match:"
            fc-match Arimo
            echo "Installed croscore package:"
            dpkg-query -W -f='${Package}=${Version}\n' fonts-croscore
          } | tee reproduction/GITHUB_ACTIONS_RENDERING_ENVIRONMENT.txt

      - name: Set up Python 3.13.5
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
          cache: 'pip'

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-build-isolation

      - name: Record environment
        run: |
          python --version | tee reproduction/GITHUB_ACTIONS_ENVIRONMENT.txt
          python -m pip freeze | tee -a reproduction/GITHUB_ACTIONS_ENVIRONMENT.txt

      - name: Run test suite
        env:
          PYTHONPATH: src
        run: pytest -q | tee reproduction/GITHUB_ACTIONS_TEST_RESULTS.txt

      - name: Validate result freeze
        env:
          PYTHONPATH: src
        run: python scripts/validate_result_freeze.py | tee reproduction/GITHUB_ACTIONS_RESULT_FREEZE_VALIDATION.txt

      - name: Verify archived publication assets
        run: python scripts/verify_publication_figure_release.py | tee reproduction/GITHUB_ACTIONS_PUBLICATION_ASSET_VALIDATION.txt

      - name: Regenerate quantitative publication figures
        run: bash scripts/reproduce_publication_figures.sh

      - name: Upload clean-room records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jrsi-reproducibility-validation-${{ github.ref_name }}
          path: |
            reproduction/GITHUB_ACTIONS_*.txt
            reproduction/PUBLICATION_FIGURE_REGEN_HASH_COMPARISON.csv
          if-no-files-found: error
